include-file = /home/tsilez/.config/polybar/theme-colors.ini

[bar/main]
width = 100%
height = 24
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
bottom = false
line-size = 2
border-size = 0
border-top-size = 4
border-bottom-size = 0
border-color = #00000000  # TUNE1
padding-left = 2
padding-right = 2
module-margin = 1
background = #00000000
foreground = ${colors.foreground}
font-0 = "JetBrainsMono Nerd Font Mono:size=12;2"
font-1 = "JetBrainsMono Nerd Font Mono:size=12;2"
font-2 = "JetBrainsMono Nerd Font Mono:size=14;3"
modules-left = i3 xwindow
modules-center =
modules-right = backlight pulseaudio bluetooth battery network
cursor-click = pointer
enable-ipc = true
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
label-focused = %{O4}%{F#B0705D}󰮯%{F-} %name%%{O4}
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-alt}
label-focused-padding = 0
label-unfocused = %{O4}%{F#B0705D}󰊠%{F-} %{F#FFFFFFFF}%name%%{F-}%{O4}
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 0
label-visible =  %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1
label-urgent = %{F#B0705D}󰀦%{F-} %name%
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 1
# ISLANDS
format-background = ${colors.background}

[module/xwindow]
type = internal/xwindow
label = %{F#B0705D}󰣆%{F-} %title:0:25:...%
label-foreground = ${colors.foreground}
label-empty = 7ZMAR  •  DESKTOP
label-empty-foreground = ${colors.foreground}
# ISLANDS
format-background = ${colors.background}
format-prefix = %{O4}
format-suffix = %{O4}

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = %{A1:/home/tsilez/.config/polybar/scripts/wifi-menu.sh:}<ramp-signal> <label-connected>%{A}
format-disconnected = <label-disconnected>
label-connected = %essid%
label-connected-foreground = ${colors.foreground}
label-disconnected = %{A1:/home/tsilez/.config/polybar/scripts/wifi-menu.sh:}%{F#B0705D}%{T3}󰤭%{T-}%{F-} Offline%{A}
label-disconnected-foreground = ${colors.foreground}

click-left = ~/.local/bin/wifi-menu
# ISLANDS
format-connected-background = ${colors.background}
format-connected-prefix = %{O4}
format-connected-suffix = %{O4}
format-disconnected-background = ${colors.background}
format-disconnected-prefix = %{O4}
format-disconnected-suffix = %{O4}
# SIGNAL
ramp-signal-foreground = ${colors.accent}
ramp-signal-0 = %{T3}󰤯%{T-}
ramp-signal-1 = %{T3}󰤟%{T-}
ramp-signal-2 = %{T3}󰤢%{T-}
ramp-signal-3 = %{T3}󰤥%{T-}
ramp-signal-4 = %{T3}󰤨%{T-}
# WIFIBIG

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 1
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-charging = %percentage%%
label-charging-foreground = ${colors.foreground}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}
label-full = %{F#B0705D}󰁹%{F-} Full
label-full-foreground = ${colors.foreground}
ramp-capacity-foreground = ${colors.accent}
# ISLANDS
format-charging-background = ${colors.background}
format-charging-prefix = %{O4}
format-charging-suffix = %{O4}
format-discharging-background = ${colors.background}
format-discharging-prefix = %{O4}
format-discharging-suffix = %{O4}
format-full-background = ${colors.background}
format-full-prefix = %{O4}
format-full-suffix = %{O4}
animation-charging-foreground = ${colors.accent}
animation-charging-framerate = 600
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
# BATRAMP
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %I:%M %p
label = %{F#B0705D}󰥔%{F-} %date% %time%
label-foreground = ${colors.foreground}
# ISLANDS
format-background = ${colors.background}
format-prefix = %{O4}
format-suffix = %{O4}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
format-muted = <label-muted>
label-muted = %{F#B0705D}󰝟%{F-} Muted
label-muted-foreground = ${colors.foreground}
ramp-volume-foreground = ${colors.accent}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol
# ISLANDS
format-volume-background = ${colors.background}
format-volume-prefix = %{O4}
format-volume-suffix = %{O4}
format-muted-background = ${colors.background}
format-muted-prefix = %{O4}
format-muted-suffix = %{O4}

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = false
scroll-interval = 5
format = <ramp> <label>
label = %{A4:brightnessctl set 5%+:}%{A5:brightnessctl set 5%-:}%percentage%%%{A}%{A}
label-foreground = ${colors.foreground}
ramp-foreground = ${colors.accent}
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
# ISLANDS
format-background = ${colors.background}
format-prefix = %{O4}
format-suffix = %{O4}

[module/bluetooth]
type = custom/script
exec = /home/tsilez/.config/polybar/scripts/bluetooth-status.sh
interval = 5
click-left = /home/tsilez/.config/polybar/scripts/bluetooth-menu.sh
# ISLANDS
format-background = ${colors.background}
format-prefix = %{O4}
format-suffix = %{O4}

# TIGHT

# TIGHT2

# CLOCKBAR
[bar/clock]
inherit = bar/main
width = 230
height = 20
offset-x = 50%:-115
offset-y = 4
radius = 10
border-size = 0
border-top-size = 0
border-bottom-size = 0
padding-left = 0
padding-right = 0
override-redirect = true
background = ${colors.background}
modules-left =
modules-center = date
modules-right =
