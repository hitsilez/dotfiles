[colors]
background = #100C18
background-alt = #201730
foreground = #E9E6F0
muted = #87838F
accent = #C65A39
red = #FF3D9A
green = #62F5C8

[bar/main]
width = 100%
height = 34
radius = 0
fixed-center = true
bottom = false
line-size = 2
border-size = 0
padding-left = 4
padding-right = 4
module-margin = 2

background = #100C18
foreground = #E9E6F0

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=10;2

modules-left = i3
modules-center = xwindow
modules-right = backlight pulseaudio network battery date

cursor-click = pointer
enable-ipc = true
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = 󰮯 %name%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.background-alt}
label-focused-padding = 2

label-unfocused = 󰊠 %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

label-visible = 󰊠 %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = 󰀦 %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = 󰣆  %title:0:42:...%
label-foreground = ${colors.muted}
label-empty = 7ZMAR  •  DESKTOP
label-empty-foreground = ${colors.accent}

[module/network]
type = internal/network
interface = wlp4s0
click-left = /home/tsiles/.config/polybar/scripts/wifi-menu.sh
interval = 3

format-connected = <ramp-signal>
format-disconnected = <label-disconnected>

label-connected =  %essid%
label-connected-foreground = ${colors.green}
label-connected-padding = 0
label-disconnected = %{A1:/home/tsiles/.config/polybar/scripts/wifi-menu.sh:}󰤭 Offline%{A}
label-disconnected-foreground = ${colors.red}

ramp-signal-0 = %{A1:/home/tsiles/.config/polybar/scripts/wifi-menu.sh:}󰤟%{A}
ramp-signal-1 = %{A1:/home/tsiles/.config/polybar/scripts/wifi-menu.sh:}󰤢%{A}
ramp-signal-2 = %{A1:/home/tsiles/.config/polybar/scripts/wifi-menu.sh:}󰤥%{A}
ramp-signal-3 = %{A1:/home/tsiles/.config/polybar/scripts/wifi-menu.sh:}󰤨%{A}
ramp-signal-4 = %{A1:/home/tsiles/.config/polybar/scripts/wifi-menu.sh:}󰤨%{A}
ramp-signal-padding = 0

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 1

format-charging = <label-charging>
format-discharging = <ramp-capacity><label-discharging>
format-full = <label-full>

label-charging = 󰂄 %percentage%%
label-charging-foreground = ${colors.green}

label-discharging =  %percentage%%
label-discharging-foreground = ${colors.foreground}

label-full = 󰁹 Full
label-full-foreground = ${colors.green}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
ramp-capacity-padding = 0

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %I:%M %p

label = 󰥔  %date%  %time%
label-foreground = ${colors.accent}


[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

format-muted = <label-muted>
label-muted = 󰝟 Muted
label-muted-foreground = ${colors.red}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = false
scroll-interval = 5

format = <ramp> <label>
label = %{A4:brightnessctl set 43+:}%{A5:brightnessctl set 43-:}%percentage%%%{A}%{A}
label-foreground = ${colors.foreground}

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
