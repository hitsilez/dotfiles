include-file = /home/tsilez/.config/polybar/theme-colors.ini

[bar/main]
width = 100%
height = 36
offset-x = 0
offset-y = 0
radius = 12
fixed-center = true
bottom = false
line-size = 2
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 2
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"
modules-left = i3
modules-center = xwindow
modules-right = backlight pulseaudio network bluetooth battery date
cursor-click = pointer
enable-ipc = true
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
label-focused = %{F#BA272D}󰮯%{F-} %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background}
label-focused-padding = 2
label-unfocused = %{F#BA272D}󰊠%{F-} %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2
label-visible =  %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2
label-urgent = %{F#BA272D}󰀦%{F-} %name%
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %{F#BA272D}󰣆%{F-}  %title:0:42:...%
label-foreground = ${colors.foreground}
label-empty = 7ZMAR  •  DESKTOP
label-empty-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{A1:/home/tsilez/.config/polybar/scripts/wifi-menu.sh:}%{F#BA272D}󰤨%{F-} %essid%%{A}
label-connected-foreground = ${colors.foreground}
label-disconnected = %{A1:/home/tsilez/.config/polybar/scripts/wifi-menu.sh:}%{F#BA272D}󰤭%{F-} Offline%{A}
label-disconnected-foreground = ${colors.foreground}

click-left = ~/.local/bin/wifi-menu
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 1
format-charging = <label-charging>
format-discharging = <ramp-capacity><label-discharging>
format-full = <label-full>
label-charging = %{F#BA272D}󰂄%{F-} %percentage%%
label-charging-foreground = ${colors.foreground}
label-discharging =  %percentage%%
label-discharging-foreground = ${colors.foreground}
label-full = %{F#BA272D}󰁹%{F-} Full
label-full-foreground = ${colors.foreground}
ramp-capacity-foreground = ${colors.accent}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %I:%M %p
label = %{F#BA272D}󰥔%{F-}  %date%  %time%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
format-muted = <label-muted>
label-muted = %{F#BA272D}󰝟%{F-} Muted
label-muted-foreground = ${colors.foreground}
ramp-volume-foreground = ${colors.accent}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = false
scroll-interval = 5
format = <ramp> <label>
label = %{A4:brightnessctl set 5%+:}%{A5:brightnessctl set 5%-:}%percentage%%%{A}%{A}
label-foreground = ${colors.foreground}
ramp-foreground = ${colors.accent}
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

[module/bluetooth]
type = custom/script
exec = /home/tsilez/.config/polybar/scripts/bluetooth-status.sh
interval = 5
click-left = /home/tsilez/.config/polybar/scripts/bluetooth-menu.sh
