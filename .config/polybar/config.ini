include-file = /home/tsilez/.config/polybar/theme-colors.ini

[bar/main]
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
bottom = false
line-size = 2
border-size = 0
border-top-size = 5
border-bottom-size = 3
border-color = #00000000  # TUNE1
padding-left = 2
padding-right = 2
module-margin = 1
background = #00000000
foreground = ${colors.foreground}
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"
modules-left = i3 xwindow
modules-center = date
modules-right = backlight pulseaudio bluetooth battery network
cursor-click = pointer
enable-ipc = true
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
label-focused = %{F#34C759}󰮯%{F-} %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-alt}
label-focused-padding = 1
label-unfocused = %{F#34C759}󰊠%{F-} %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1
label-visible =  %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1
label-urgent = %{F#34C759}󰀦%{F-} %name%
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 1
# ISLANDS
format-background = ${colors.background}

[module/xwindow]
type = internal/xwindow
label = %{F#34C759}󰣆%{F-} %title:0:42:...%
label-foreground = ${colors.foreground}
label-empty = 7ZMAR  •  DESKTOP
label-empty-foreground = ${colors.foreground}
# ISLANDS
format-background = ${colors.background}
format-padding = 1

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{A1:/home/tsilez/.config/polybar/scripts/wifi-menu.sh:}%{F#34C759}󰤨%{F-} %essid%%{A}
label-connected-foreground = ${colors.foreground}
label-disconnected = %{A1:/home/tsilez/.config/polybar/scripts/wifi-menu.sh:}%{F#34C759}󰤭%{F-} Offline%{A}
label-disconnected-foreground = ${colors.foreground}

click-left = ~/.local/bin/wifi-menu
# ISLANDS
format-connected-background = ${colors.background}
format-connected-padding = 1
format-disconnected-background = ${colors.background}
format-disconnected-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 1
format-charging = <label-charging>
format-discharging = <ramp-capacity><label-discharging>
format-full = <label-full>
label-charging = %{F#34C759}󰂄%{F-} %percentage%%
label-charging-foreground = ${colors.foreground}
label-discharging =  %percentage%%
label-discharging-foreground = ${colors.foreground}
label-full = %{F#34C759}󰁹%{F-} Full
label-full-foreground = ${colors.foreground}
ramp-capacity-foreground = ${colors.accent}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
# ISLANDS
format-charging-background = ${colors.background}
format-charging-padding = 1
format-discharging-background = ${colors.background}
format-discharging-padding = 1
format-full-background = ${colors.background}
format-full-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %I:%M %p
label = %{F#34C759}󰥔%{F-} %date% %time%
label-foreground = ${colors.foreground}
# ISLANDS
format-background = ${colors.background}
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
format-muted = <label-muted>
label-muted = %{F#34C759}󰝟%{F-} Muted
label-muted-foreground = ${colors.foreground}
ramp-volume-foreground = ${colors.accent}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol
# ISLANDS
format-volume-background = ${colors.background}
format-volume-padding = 1
format-muted-background = ${colors.background}
format-muted-padding = 1

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = false
scroll-interval = 5
format = <ramp> <label>
label = %{A4:brightnessctl set 5%+:}%{A5:brightnessctl set 5%-:}%percentage%%%{A}%{A}
label-foreground = ${colors.foreground}
ramp-foreground = ${colors.accent}
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
# ISLANDS
format-background = ${colors.background}
format-padding = 1

[module/bluetooth]
type = custom/script
exec = /home/tsilez/.config/polybar/scripts/bluetooth-status.sh
interval = 5
click-left = /home/tsilez/.config/polybar/scripts/bluetooth-menu.sh
# ISLANDS
format-background = ${colors.background}
format-padding = 1

