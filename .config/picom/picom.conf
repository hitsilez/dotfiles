backend = "glx";
vsync = true;

# iOS Style Curved Corners
corner-radius = 16;
rounded-corners-exclude = [
  "class_g = 'Polybar'", "window_type = 'dock'", # POLYBAR-FIX
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Soft Ambient Shadows
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -18;

# Smooth Transitions
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# iOS Frosted Glass Effect
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-exclude = [
  "class_g = 'Polybar'", "window_type = 'dock'", # POLYBAR-FIX
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Opacity Rules
active-opacity = 1.0;
inactive-opacity = 0.92;

shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'"
];
