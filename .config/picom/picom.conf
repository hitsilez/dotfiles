backend = "glx";
vsync = true;

corner-radius = 0;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
];

shadow = true;
shadow-radius = 18;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.35;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

detect-rounded-corners = true;
