general {
    lock_cmd = pidof hyprlock || /home/tsilez/.local/bin/lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

# 2.5 minutes without activity: dim the screen
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 minutes: turn the screen off
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 15 minutes: lock the screen (your original setting)
listener {
    timeout = 290
    on-timeout = loginctl lock-session
}

# 20 minutes: sleep, but only when running on battery
listener {
    timeout = 1200
    on-timeout = /home/tsilez/.local/bin/idle-suspend
}
