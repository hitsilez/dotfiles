
# --- My keybinds ---
bind = SUPER, Return, exec, alacritty
bind = SUPER, Space, exec, pkill wofi || wofi --show drun
bind = SUPER, B, exec, chromium
bind = SUPER, W, killactive
bind = SUPER, M, exec, elisa

# --- Autostart ---
# exec-once = waybar

# --- Reload config ---
bind = SUPER SHIFT, R, exec, hyprctl reload && hyprctl notify -1 3000 "rgb(00ff00)" "Config reloaded"
bind = ALT, T, exec, alacritty
