general {
    hide_cursor = true
}

background {
    path = /home/tsilez/.cache/hyprlock-wallpaper
    color = rgba(10, 12, 22, 1.0)
    blur_passes = 1
    blur_size = 6
    brightness = 0.72
    contrast = 0.95
    vibrancy = 0.15
}

label {
    text = $TIME12
    color = rgba(255, 255, 255, 1.0)
    font_size = 82
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(210, 218, 238, 0.95)
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    size = 340, 58
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = rgba(96, 165, 250, 0.95)
    inner_color = rgba(15, 20, 35, 0.82)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Enter your password</i>
    rounding = 18
    position = 0, -90
    halign = center
    valign = center
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
}
